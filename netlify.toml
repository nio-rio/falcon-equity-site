[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[context.deploy-preview.headers]]
  for = "/*"
  [context.deploy-preview.headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[context.branch-deploy.headers]]
  for = "/*"
  [context.branch-deploy.headers.values]
    X-Robots-Tag = "noindex, nofollow"

# Pretty URLs 301 /path/ → /path with a "Document moved" body. Rewrite instead
# so /contact/ and /blog/.../ serve the canonical HTML (force beats Pretty URLs).
[[redirects]]
  from = "/*/"
  to = "/:splat"
  status = 200
  force = true
